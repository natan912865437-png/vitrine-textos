<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitrine Textos</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }
    main {
      max-width: 760px;
      min-height: 100vh;
      margin: auto;
      padding: 32px 20px;
      box-sizing: border-box;
      display: grid;
      place-items: center;
    }
    section {
      width: 100%;
      padding: 40px 24px;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }
    h1 { margin-top: 0; }
    .price {
      color: #2f6fed;
      font-size: 30px;
      font-weight: bold;
    }
    ul {
      max-width: 430px;
      margin: 24px auto;
      text-align: left;
      line-height: 1.8;
    }
    a {
      display: inline-block;
      padding: 15px 22px;
      border-radius: 10px;
      background: #25d366;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Descrições profissionais para seus produtos</h1>
      <p>Textos claros e persuasivos, prontos para vender.</p>
      <p class="price">R$ 80 por 10 descrições</p>
      <ul>
        <li>Entrega em até 48 horas</li>
        <li>Uma revisão gratuita</li>
        <li>Arquivo organizado em planilha</li>
        <li>Texto adaptado ao seu público</li>
      </ul>
      <a
        href="https://wa.me/5524999892992?text=Ol%C3%A1!%20Quero%20descri%C3%A7%C3%B5es%20para%20meus%20produtos."
        target="_blank"
        rel="noopener"
      >
        Pedir pelo WhatsApp
      </a>
    </section>
  </main>
</body>
</html>
